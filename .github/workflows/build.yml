name: Build feeds

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feeds
        run: |
          mkdir -p public
          python build_feed.py --out public/trinasty-produkty.xml > public/stats.json
          cat public/stats.json
          cp index.html public/index.html

      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last-run.txt
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add last-run.txt
          git commit -m "feed $(cat last-run.txt) [skip ci]" || true
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
